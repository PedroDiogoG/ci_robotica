manager:
  ros__parameters:
    # Limites e tolerâncias de chegada
    max_linear_vel: 0.2     # m/s
    max_angular_vel: 1.5    # rad/s
    pos_tolerance: 0.05     # m
    yaw_tolerance: 0.08     # rad (~4.5 graus)

    # PID linear: erro eb_x -> velocidade linear v
    linear:
      p: 0.8
      i: 0.0
      d: 0.0
      i_max: 0.5
      i_min: -0.5
      antiwindup: true

    # PID lateral: erro eb_y -> contribui para a velocidade angular w
    lateral:
      p: 1.5
      i: 0.0
      d: 0.05
      i_max: 1.0
      i_min: -1.0
      antiwindup: true

    # PID angular: erro eb_theta -> contribui para a velocidade angular w
    angular:
      p: 1.2
      i: 0.0
      d: 0.05
      i_max: 1.0
      i_min: -1.0
      antiwindup: true
