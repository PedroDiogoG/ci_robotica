manager:
  ros__parameters:
    # Limites e tolerâncias de chegada
    max_linear_vel: 0.2     # m/s
    max_angular_vel: 1.5    # rad/s
    pos_tolerance: 0.05     # m
    yaw_tolerance: 0.08     # rad (~4.5 graus)

    # PID linear: erro eb_x -> velocidade linear v
    linear:
      p: 1.5
      i: 0.0
      d: 0.0
      i_max: 0.5
      i_min: -0.5
      antiwindup: true

    # PID lateral: angulo alpha ate o alvo (rad) -> velocidade angular w
    # Estabilidade da lei polar exige p > linear.p (aqui 2x)
    lateral:
      p: 3.0
      i: 0.0
      d: 0.05
      i_max: 1.0
      i_min: -1.0
      antiwindup: true

    # PID angular: erro eb_theta -> contribui para a velocidade angular w
    angular:
      p: 2.0
      i: 0.0
      d: 0.05
      i_max: 1.0
      i_min: -1.0
      antiwindup: true
